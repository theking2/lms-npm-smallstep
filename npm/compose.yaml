# Nginx Proxy Manager
# Das externe Netzwerk "proxy" verbindet NPM mit den Containern, die er bedient.
networks:
  proxy:
    external: true

services:
  nginx-proxy:
    container_name: nginx-proxy
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    networks:
      - proxy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      # 80/443 sind auf NAS-Systemen meist durch die Verwaltungsoberfläche belegt,
      # daher Standardwerte 9080/9443; am Router 80->9080 und 443->9443 weiterleiten.
      - "${NPM_HTTP_PORT:-9080}:80"
      - "${NPM_HTTPS_PORT:-9443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - ${NPM_DATA}/data:/data
      - ${NPM_DATA}/letsencrypt:/etc/letsencrypt
